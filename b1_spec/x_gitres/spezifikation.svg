<svg viewBox="0 0 1200 790" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowSpec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7a"/>
    </marker>
    <filter id="docShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="790" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2d3d">
    Spezifikation (Pflichtenheft)
  </text>

  <!-- Lastenheft vs Pflichtenheft -->
  <g filter="url(#docShadow)">
    <rect x="150" y="70" width="320" height="92" rx="10" fill="#5b8fc7"/>
  </g>
  <text x="310" y="103" text-anchor="middle" font-size="16.5" font-weight="700" fill="#ffffff">Lastenheft</text>
  <text x="310" y="123" text-anchor="middle" font-size="12" fill="#eaf2fa">(verfasst vom Auftraggeber)</text>
  <text x="310" y="145" text-anchor="middle" font-size="13" font-style="italic" fill="#ffffff">WAS wird gewünscht?</text>

  <g filter="url(#docShadow)">
    <rect x="730" y="70" width="320" height="92" rx="10" fill="#274d78"/>
  </g>
  <text x="890" y="103" text-anchor="middle" font-size="16.5" font-weight="700" fill="#ffffff">Pflichtenheft</text>
  <text x="890" y="123" text-anchor="middle" font-size="12" fill="#cfe0ee">(verfasst vom Auftragnehmer)</text>
  <text x="890" y="145" text-anchor="middle" font-size="13" font-style="italic" fill="#ffffff">WIE wird es umgesetzt?</text>

  <path d="M 470 116 L 725 116" stroke="#5a6b7a" stroke-width="2.5" fill="none" marker-end="url(#arrowSpec)"/>
  <text x="600" y="104" text-anchor="middle" font-size="12" fill="#5a6b7a">beantwortet mit</text>

  <!-- Convergence into the combined Spezifikation -->
  <path d="M 310 162 L 520 248" stroke="#8a97a3" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrowSpec)"/>
  <path d="M 890 162 L 680 248" stroke="#8a97a3" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrowSpec)"/>
  <text x="600" y="196" text-anchor="middle" font-size="12.5" fill="#5a6b7a" font-style="italic">In diesem Kurs vereinfacht zusammengeführt als</text>
  <text x="600" y="213" text-anchor="middle" font-size="12.5" fill="#5a6b7a" font-style="italic">kompakte Spezifikation:</text>

  <!-- Document representing the Spezifikation -->
  <g filter="url(#docShadow)">
    <rect x="150" y="250" width="900" height="480" rx="14" fill="#ffffff" stroke="#d7dfe6" stroke-width="2"/>
  </g>
  <path d="M 150 264 A 14 14 0 0 1 164 250 L 1036 250 A 14 14 0 0 1 1050 264 L 1050 314 L 150 314 Z" fill="#17324f"/>
  <text x="600" y="284" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Spezifikation</text>
  <text x="600" y="302" text-anchor="middle" font-size="12" fill="#cfe0ee">Bestandteile gemäss Kapitel 3.2</text>

  <!-- Row 0: Ausgangslage -->
  <rect x="170" y="317" width="10" height="60" fill="#2f6fb0"/>
  <text x="195" y="341" font-size="15" font-weight="700" fill="#1f2d3d">Ausgangslage</text>
  <text x="195" y="361" font-size="12.5" fill="#5a6b7a">Warum wird die Software gebraucht?</text>
  <line x1="170" y1="385" x2="1030" y2="385" stroke="#eef1f4" stroke-width="1"/>

  <!-- Row 1: Funktionale Anforderungen -->
  <rect x="170" y="385" width="10" height="60" fill="#1f8a5f"/>
  <text x="195" y="409" font-size="15" font-weight="700" fill="#1f2d3d">Funktionale Anforderungen</text>
  <text x="195" y="429" font-size="12.5" fill="#5a6b7a">Was muss sie tun? (priorisiert: Muss / Soll / Kann)</text>
  <line x1="170" y1="453" x2="1030" y2="453" stroke="#eef1f4" stroke-width="1"/>

  <!-- Row 2: Nicht-funktionale Anforderungen -->
  <rect x="170" y="453" width="10" height="60" fill="#c98a1b"/>
  <text x="195" y="477" font-size="15" font-weight="700" fill="#1f2d3d">Nicht-funktionale Anforderungen</text>
  <text x="195" y="497" font-size="12.5" fill="#5a6b7a">Wie schnell, sicher, bedienbar muss sie sein?</text>
  <line x1="170" y1="521" x2="1030" y2="521" stroke="#eef1f4" stroke-width="1"/>

  <!-- Row 3: Abgrenzung -->
  <rect x="170" y="521" width="10" height="60" fill="#b0413e"/>
  <text x="195" y="545" font-size="15" font-weight="700" fill="#1f2d3d">Abgrenzung</text>
  <text x="195" y="565" font-size="12.5" fill="#5a6b7a">Was gehört ausdrücklich nicht dazu?</text>
  <line x1="170" y1="589" x2="1030" y2="589" stroke="#eef1f4" stroke-width="1"/>

  <!-- Row 4: Schnittstellen -->
  <rect x="170" y="589" width="10" height="60" fill="#6a4fb0"/>
  <text x="195" y="613" font-size="15" font-weight="700" fill="#1f2d3d">Schnittstellen</text>
  <text x="195" y="633" font-size="12.5" fill="#5a6b7a">Womit muss sie zusammenarbeiten (Dateien, Systeme)?</text>
  <line x1="170" y1="657" x2="1030" y2="657" stroke="#eef1f4" stroke-width="1"/>

  <!-- Row 5: Randbedingungen -->
  <rect x="170" y="657" width="10" height="60" fill="#55606b"/>
  <text x="195" y="681" font-size="15" font-weight="700" fill="#1f2d3d">Randbedingungen</text>
  <text x="195" y="701" font-size="12.5" fill="#5a6b7a">Plattform, Budget, Zeitrahmen, Vorschriften</text>

  <text x="600" y="765" text-anchor="middle" font-size="12" fill="#8a97a3">
    Die Spezifikation ist die zentrale Schnittstelle zwischen Auftraggeber/-in und Entwickler/-in (Kapitel 3.1)
  </text>
</svg>
