<svg viewBox="0 0 1660 950" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7a"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a1a1a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1660" height="950" fill="#ffffff"/>

  <text x="830" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2d3d">
    Das klassische Phasenmodell (Wasserfallmodell)
  </text>

  <!-- Layout: box W=170,H=85 ; step dx=280, dy=130 -> gap_h=110, gap_v=45 (grosszügiger Abstand) -->

  <!-- Connecting elbow arrows -->
  <!-- 0->1 -->
  <path d="M 115 155 L 115 175 L 395 175 L 395 200" stroke="#5a6b7a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 1->2 -->
  <path d="M 395 285 L 395 305 L 675 305 L 675 330" stroke="#5a6b7a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 2->3 -->
  <path d="M 675 415 L 675 435 L 955 435 L 955 460" stroke="#5a6b7a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 3->4 -->
  <path d="M 955 545 L 955 565 L 1235 565 L 1235 590" stroke="#5a6b7a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 4->5 -->
  <path d="M 1235 675 L 1235 695 L 1527.5 695 L 1527.5 720" stroke="#5a6b7a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- water-drop motifs on the horizontal segments -->
  <g opacity="0.55" fill="#8fc1ea">
    <circle cx="255" cy="175" r="4"/>
    <circle cx="535" cy="305" r="4"/>
    <circle cx="815" cy="435" r="4"/>
    <circle cx="1095" cy="565" r="4"/>
    <circle cx="1381.25" cy="695" r="4"/>
  </g>

  <!-- Phase 1: Anforderungsanalyse -->
  <g filter="url(#softShadow)">
    <rect x="30" y="70" width="170" height="85" rx="10" fill="#2f6fb0"/>
  </g>
  <text x="115" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Anforderungs-</text>
  <text x="115" y="126" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">analyse</text>
  <text x="115" y="185" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">Was soll die Software</text>
  <text x="115" y="201" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">leisten?</text>
  <text x="115" y="225" text-anchor="middle" font-size="12" fill="#6b7b8c">Ergebnis:</text>
  <text x="115" y="241" text-anchor="middle" font-size="12" fill="#6b7b8c">Spezifikation</text>

  <!-- Phase 2: Entwurf -->
  <g filter="url(#softShadow)">
    <rect x="310" y="200" width="170" height="85" rx="10" fill="#2a689f"/>
  </g>
  <text x="395" y="248" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Entwurf</text>
  <text x="395" y="315" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">Wie ist die Lösung</text>
  <text x="395" y="331" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">strukturiert?</text>
  <text x="395" y="355" text-anchor="middle" font-size="12" fill="#6b7b8c">Ergebnis: Zustands-</text>
  <text x="395" y="371" text-anchor="middle" font-size="12" fill="#6b7b8c">diagramm, Struktogramm, PAP</text>

  <!-- Phase 3: Implementierung -->
  <g filter="url(#softShadow)">
    <rect x="590" y="330" width="170" height="85" rx="10" fill="#25628f"/>
  </g>
  <text x="675" y="378" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Implementierung</text>
  <text x="675" y="445" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">Wie wird es konkret</text>
  <text x="675" y="461" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">umgesetzt?</text>
  <text x="675" y="485" text-anchor="middle" font-size="12" fill="#6b7b8c">Ergebnis: Quellcode</text>

  <!-- Phase 4: Test -->
  <g filter="url(#softShadow)">
    <rect x="870" y="460" width="170" height="85" rx="10" fill="#1f5a80"/>
  </g>
  <text x="955" y="508" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Test</text>
  <text x="955" y="575" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">Funktioniert es wie</text>
  <text x="955" y="591" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">gefordert?</text>
  <text x="955" y="615" text-anchor="middle" font-size="12" fill="#6b7b8c">Ergebnis: Testprotokoll,</text>
  <text x="955" y="631" text-anchor="middle" font-size="12" fill="#6b7b8c">Fehlerliste</text>

  <!-- Phase 5: Einführung/Betrieb -->
  <g filter="url(#softShadow)">
    <rect x="1150" y="590" width="170" height="85" rx="10" fill="#1a5273"/>
  </g>
  <text x="1235" y="626" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Einführung /</text>
  <text x="1235" y="646" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Betrieb</text>
  <text x="1235" y="705" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">Wie gelangt sie in den</text>
  <text x="1235" y="721" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">produktiven Einsatz?</text>
  <text x="1235" y="745" text-anchor="middle" font-size="12" fill="#6b7b8c">Ergebnis: Installation,</text>
  <text x="1235" y="761" text-anchor="middle" font-size="12" fill="#6b7b8c">Schulung</text>

  <!-- Phase 6: Wartung -->
  <g filter="url(#softShadow)">
    <rect x="1430" y="720" width="195" height="85" rx="10" fill="#134966"/>
  </g>
  <text x="1510" y="768" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Wartung</text>
  <text x="1595" y="770" text-anchor="middle" font-size="22" fill="#ffffff" opacity="0.85">∞</text>
  <text x="1527.5" y="835" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">Läuft es stabil, wie werden</text>
  <text x="1527.5" y="851" text-anchor="middle" font-size="12.5" fill="#3a4b5c" font-style="italic">Änderungen gehandhabt?</text>
  <text x="1527.5" y="875" text-anchor="middle" font-size="12" fill="#6b7b8c">Ergebnis: Changelog,</text>
  <text x="1527.5" y="891" text-anchor="middle" font-size="12" fill="#6b7b8c">neue Versionen</text>

  <rect x="30" y="915" width="1600" height="1" fill="#e2e8f0"/>
  <text x="830" y="935" text-anchor="middle" font-size="12" fill="#8a97a3">Lineares, sequenzielles Vorgehen – jede Phase beginnt erst nach Abschluss der vorherigen</text>
</svg>
