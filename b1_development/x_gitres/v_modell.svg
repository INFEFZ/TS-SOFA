<svg viewBox="0 0 1150 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7a"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a1a1a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1150" height="700" fill="#ffffff"/>

  <text x="575" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2d3d">
    Das V-Modell
  </text>
  <text x="575" y="62" text-anchor="middle" font-size="14" fill="#5a6b7a" font-style="italic">
    Jede Entwurfsebene erhält eine spiegelbildliche, passende Testebene
  </text>

  <!-- Sequence arrows forming the V outline -->
  <path d="M 150 175 L 260 275" stroke="#5a6b7a" stroke-width="2.5" marker-end="url(#arrowV)" fill="none"/>
  <path d="M 295 315 L 405 415" stroke="#5a6b7a" stroke-width="2.5" marker-end="url(#arrowV)" fill="none"/>
  <path d="M 440 460 L 500 505" stroke="#5a6b7a" stroke-width="2.5" marker-end="url(#arrowV)" fill="none"/>
  <path d="M 650 505 L 710 460" stroke="#5a6b7a" stroke-width="2.5" marker-end="url(#arrowV)" fill="none"/>
  <path d="M 745 415 L 855 315" stroke="#5a6b7a" stroke-width="2.5" marker-end="url(#arrowV)" fill="none"/>
  <path d="M 890 275 L 1000 175" stroke="#5a6b7a" stroke-width="2.5" marker-end="url(#arrowV)" fill="none"/>

  <!-- Dashed correspondence lines (left design phase <-> right test phase) -->
  <path d="M 240 130 L 910 130" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#arrowDashed)" fill="none"/>
  <path d="M 385 270 L 765 270" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#arrowDashed)" fill="none"/>
  <path d="M 530 410 L 620 410" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#arrowDashed)" fill="none"/>

  <text x="575" y="118" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="600">leitet Abnahmekriterien ab</text>
  <text x="575" y="258" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="600">leitet Systemtestfälle ab</text>
  <text x="575" y="398" text-anchor="middle" font-size="11.5" fill="#c0392b" font-weight="600">leitet Modultests ab</text>

  <!-- Level 1: Anforderungsanalyse (left) / Abnahmetest (right) -->
  <g filter="url(#softShadow2)">
    <rect x="30" y="90" width="180" height="85" rx="10" fill="#2f6fb0"/>
  </g>
  <text x="120" y="126" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Anforderungs-</text>
  <text x="120" y="146" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">analyse</text>
  <text x="120" y="165" text-anchor="middle" font-size="11" fill="#e3edf7">Was soll das System leisten?</text>

  <g filter="url(#softShadow2)">
    <rect x="940" y="90" width="180" height="85" rx="10" fill="#2f6fb0"/>
  </g>
  <text x="1030" y="126" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Abnahmetest</text>
  <text x="1030" y="150" text-anchor="middle" font-size="11" fill="#e3edf7">Erfüllt das System die</text>
  <text x="1030" y="165" text-anchor="middle" font-size="11" fill="#e3edf7">ursprünglichen Anforderungen?</text>

  <!-- Level 2: Grobentwurf (left) / Systemtest (right) -->
  <g filter="url(#softShadow2)">
    <rect x="175" y="230" width="180" height="85" rx="10" fill="#25628f"/>
  </g>
  <text x="265" y="272" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Grobentwurf</text>
  <text x="265" y="296" text-anchor="middle" font-size="11" fill="#dcebf7">Architektur, Zusammenspiel</text>
  <text x="265" y="309" text-anchor="middle" font-size="11" fill="#dcebf7">der Systemteile</text>

  <g filter="url(#softShadow2)">
    <rect x="795" y="230" width="180" height="85" rx="10" fill="#25628f"/>
  </g>
  <text x="885" y="272" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Systemtest</text>
  <text x="885" y="296" text-anchor="middle" font-size="11" fill="#dcebf7">Funktioniert das Gesamt-</text>
  <text x="885" y="309" text-anchor="middle" font-size="11" fill="#dcebf7">system wie entworfen?</text>

  <!-- Level 3: Feinentwurf (left) / Modultest (right) -->
  <g filter="url(#softShadow2)">
    <rect x="320" y="370" width="180" height="85" rx="10" fill="#1a5273"/>
  </g>
  <text x="410" y="412" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Feinentwurf</text>
  <text x="410" y="436" text-anchor="middle" font-size="11" fill="#d3e5f2">Detaillierte Struktur</text>
  <text x="410" y="449" text-anchor="middle" font-size="11" fill="#d3e5f2">einzelner Komponenten</text>

  <g filter="url(#softShadow2)">
    <rect x="650" y="365" width="180" height="95" rx="10" fill="#1a5273"/>
  </g>
  <text x="740" y="400" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Modultest /</text>
  <text x="740" y="419" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Komponententest</text>
  <text x="740" y="441" text-anchor="middle" font-size="11" fill="#d3e5f2">Funktioniert jede Komponente</text>
  <text x="740" y="454" text-anchor="middle" font-size="11" fill="#d3e5f2">für sich korrekt?</text>

  <!-- Bottom: Implementierung -->
  <g filter="url(#softShadow2)">
    <rect x="465" y="500" width="220" height="80" rx="10" fill="#134966"/>
  </g>
  <text x="575" y="536" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">Implementierung</text>
  <text x="575" y="558" text-anchor="middle" font-size="11.5" fill="#c9dfec">Umsetzung im Quellcode</text>

  <!-- Legend -->
  <rect x="30" y="620" width="16" height="16" fill="#5a6b7a"/>
  <text x="54" y="633" font-size="13" fill="#3a4b5c">Zeitlicher Ablauf (Entwurf → Implementierung → Test)</text>

  <line x1="30" y1="662" x2="46" y2="662" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="54" y="667" font-size="13" fill="#3a4b5c">Fachlicher Bezug: Testebene wird bereits während des Entwurfs geplant</text>
</svg>
