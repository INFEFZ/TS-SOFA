<svg viewBox="0 0 1200 730" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowZ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7a"/>
    </marker>
    <marker id="arrowZsmall" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7a"/>
    </marker>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a1a1a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="730" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2d3d">
    Zustandsdiagramm – Notationselemente und Beispiel
  </text>

  <!-- ============ SECTION 1: Notationselemente (4 Legend Cards) ============ -->

  <!-- Card 1: Zustand -->
  <rect x="30" y="70" width="270" height="180" rx="10" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="165" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Zustand</text>
  <g filter="url(#cardShadow)">
    <rect x="95" y="128" width="140" height="55" rx="10" fill="#2f6fb0"/>
  </g>
  <text x="165" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Heizt</text>
  <text x="165" y="205" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5a6b7a">Stabile Situation, in der</text>
  <text x="165" y="219" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5a6b7a">das System verharrt</text>

  <!-- Card 2: Startzustand -->
  <rect x="320" y="70" width="270" height="180" rx="10" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="455" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Startzustand</text>
  <circle cx="390" cy="155" r="8" fill="#1f2d3d"/>
  <path d="M 398 155 L 418 155" stroke="#5a6b7a" stroke-width="2.5" marker-end="url(#arrowZsmall)"/>
  <g filter="url(#cardShadow)">
    <rect x="420" y="128" width="110" height="55" rx="10" fill="#2f6fb0"/>
  </g>
  <text x="475" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Bereit</text>
  <text x="455" y="205" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5a6b7a">Zustand beim</text>
  <text x="455" y="219" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5a6b7a">Systemstart</text>

  <!-- Card 3: Endzustand -->
  <rect x="610" y="70" width="270" height="180" rx="10" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="745" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Endzustand (optional)</text>
  <circle cx="745" cy="157" r="16" fill="none" stroke="#274d78" stroke-width="2.5"/>
  <circle cx="745" cy="157" r="7" fill="#274d78"/>
  <text x="745" y="205" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5a6b7a">Nicht jedes System hat</text>
  <text x="745" y="219" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5a6b7a">ein definiertes Ende</text>

  <!-- Card 4: Übergang / Transition -->
  <rect x="900" y="70" width="270" height="180" rx="10" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1035" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Übergang / Transition</text>
  <text x="1035" y="147" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6b7a">Ereignis</text>
  <path d="M 955 157 L 1115 157" stroke="#5a6b7a" stroke-width="2.5" marker-end="url(#arrowZ)"/>
  <text x="1035" y="205" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5a6b7a">Auslöser für den</text>
  <text x="1035" y="219" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5a6b7a">Zustandswechsel</text>

  <line x1="30" y1="262" x2="1170" y2="262" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ============ SECTION 2: Korrektes Beispiel Wasserkocher ============ -->

  <text x="600" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2d3d">
    Korrektes Beispiel: Wasserkocher
  </text>

  <!-- Callout: Zustand -->
  <rect x="440" y="300" width="220" height="42" rx="8" fill="#eaf2fa" stroke="#2f6fb0" stroke-width="1.5"/>
  <text x="550" y="316" text-anchor="middle" font-size="11" fill="#274d78">= Zustand (verharrt, bis ein</text>
  <text x="550" y="330" text-anchor="middle" font-size="11" fill="#274d78">Ereignis eintritt)</text>
  <path d="M 550 342 L 550 378" stroke="#2f6fb0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowZsmall)"/>

  <!-- Start marker -->
  <circle cx="60" cy="420" r="8" fill="#1f2d3d"/>
  <path d="M 68 420 L 88 420" stroke="#5a6b7a" stroke-width="2.5" marker-end="url(#arrowZ)"/>

  <!-- State boxes -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="380" width="160" height="80" rx="10" fill="#2f6fb0"/>
  </g>
  <text x="170" y="426" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Aus</text>

  <g filter="url(#cardShadow)">
    <rect x="470" y="380" width="160" height="80" rx="10" fill="#2f6fb0"/>
  </g>
  <text x="550" y="426" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Heizt</text>

  <g filter="url(#cardShadow)">
    <rect x="850" y="380" width="220" height="80" rx="10" fill="#2f6fb0"/>
  </g>
  <text x="960" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Fertig /</text>
  <text x="960" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Abschaltung</text>

  <!-- Transitions -->
  <path d="M 250 420 L 465 420" stroke="#5a6b7a" stroke-width="2.5" fill="none" marker-end="url(#arrowZ)"/>
  <text x="357" y="410" text-anchor="middle" font-size="12.5" fill="#3a4b5c">Einschalten</text>

  <path d="M 630 420 L 845 420" stroke="#5a6b7a" stroke-width="2.5" fill="none" marker-end="url(#arrowZ)"/>
  <text x="737" y="410" text-anchor="middle" font-size="12.5" fill="#3a4b5c">Siedetemp. erreicht</text>

  <!-- Callout: Ereignis -->
  <path d="M 737 460 L 737 480" stroke="#b0413e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowZsmall)"/>
  <rect x="622" y="480" width="230" height="46" rx="8" fill="#fdecea" stroke="#b0413e" stroke-width="1.5"/>
  <text x="737" y="497" text-anchor="middle" font-size="11" fill="#8c2f2c">= Ereignis (löst den Wechsel aus,</text>
  <text x="737" y="511" text-anchor="middle" font-size="11" fill="#8c2f2c">ist selbst KEIN eigener Zustand!)</text>

  <!-- Return loop: Fertig -> Aus -->
  <path d="M 960 460 L 960 600 L 170 600 L 170 460" stroke="#5a6b7a" stroke-width="2.5" fill="none" marker-end="url(#arrowZ)"/>
  <text x="565" y="590" text-anchor="middle" font-size="12.5" fill="#3a4b5c">manuell ausschalten</text>

  <text x="600" y="655" text-anchor="middle" font-size="12.5" fill="#8a97a3" font-style="italic">
    Häufigster Fehler: Ein Ereignis (z. B. "Einschalten") wird fälschlich als eigener Zustand modelliert – siehe Kapitel 4.1
  </text>
</svg>
